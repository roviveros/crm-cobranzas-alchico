  <p class="sm mut">Mora: saldo de la cuota × tasa anual de la operación ÷ 365 × días de atraso. Punitorio: ${fmt(c.pctPunitorio)}% de la mora. Gastos de cobranza: Gs. ${fmt(c.gastoMonto)} por cuota desde ${c.gastoDias} días de atraso. IVA ${c.aplicaIva === false ? 'no aplicado' : fmt(c.ivaPct) + '% sobre mora + punitorio' + (c.gastoIva === false ? '' : ' + gastos')}. Proyección sin pagos parciales de cuota.</p>`
    : `<p class="sm mut">Sin cuotas vencidas al ${fd(f)}.</p>`}</div>`;
}
async function guardarGestion(doc, form) {
  const c = cfg(); const err = $('#gErr'); err.textContent = '';
  const res = form.res.value; const rr = c.resultados.find(r => r.n === res);
  const pm = +(form.pm.value.replace(/\D/g, '')) || 0, pf = form.pf.value, px = form.px.value, hoy = L.today();
  if (rr?.p && (!pm || !pf)) { err.textContent = 'Este resultado exige monto y fecha de promesa.'; return; }
  if (rr?.x && !px) { err.textContent = 'Este resultado exige la fecha de próximo contacto.'; return; }
  if ((pm && !pf) || (pf && !pm)) { err.textContent = 'Completa monto y fecha de la promesa.'; return; }
  if (pf && pf < hoy) { err.textContent = 'La fecha de promesa no puede ser anterior a hoy.'; return; }
  if (px && px < hoy) { err.textContent = 'El próximo contacto no puede ser anterior a hoy.'; return; }
  const f = S.D.filas.find(x => x.doc === doc);
  const cl = f?.cl || S.D.cli.get(doc);
  const item = { id: rid(), ts: nowTs(), autor: S.uid || '', au: meAsesor()?.id || 'adm', a: f?.x.a || '', doc, nom: f?.nom || cl?.nom || '', canal: form.canal.value, res, obs: form.obs.value.trim().slice(0, 1000) };
  if (pm) { item.pm = pm; item.pf = pf; }
  if (px) item.px = px;
  else if (pf) item.px = pf; // si hay promesa, agendar seguimiento en la fecha prometida
  const key = meAsesor()?.id || 'adm';
  const path = `gestiones/${hoy}_${key}`;
  const btn = form.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    await enCola(async () => {
      const ref = S.db.doc(path); const snap = await ref.get();
      const items = snap.exists ? (snap.data().items || []) : [];
      await ref.set({ mes: L.monthOf(hoy), fecha: hoy, key, items: items.concat([item]) });
    });
    form.reset(); toast('Gestión guardada');
  } catch (e) { err.textContent = errMsg(e); }
  btn.disabled = false;
}
async function borrarGestion(docId, id) {
  if (!(await confirmar('<h3>Eliminar gestión</h3><p>¿Eliminar esta gestión del historial?</p>', 'Eliminar'))) return;
  try {
    await enCola(async () => {
      const ref = S.db.doc('gestiones/' + docId); const snap = await ref.get(); if (!snap.exists) return;
      const d = snap.data(); await ref.set(Object.assign({}, d, { items: (d.items || []).filter(x => x.id !== id) }));
    });
    toast('Gestión eliminada');
  } catch (e) { toast(errMsg(e)); }
}
async function reasignar(doc, a) {
  const mes = S.D.mes;
  try {
    await enCola(async () => {
      const ref = S.db.doc('asignaciones/' + mes); const snap = await ref.get(); if (!snap.exists) return;
      const d = snap.data(); const map = Object.assign({}, d.map); map[doc] = Object.assign({}, map[doc], { a, f: L.today(), o: 'M' });
      await ref.set(Object.assign({}, d, { map }));
    });
    toast('Cliente reasignado a ' + asesorNom(a));
  } catch (e) { toast(errMsg(e)); }
}
async function redistribuir() {
  const act = cfg().asesores.filter(a => a.activo);
  if (!act.length) return toast('No hay asesores activos.');
  const mes = S.D.mes;
  if (!(await confirmar(`<h3>Redistribuir cartera</h3><p>Los clientes de asesores inactivos se repartirán entre los ${act.length} asesores activos, equilibrando cantidad y saldo.</p>`))) return;
  try {
    let n = 0;
    await enCola(async () => {
      const ref = S.db.doc('asignaciones/' + mes); const snap = await ref.get(); if (!snap.exists) return;
      const d = snap.data(); const map = Object.assign({}, d.map);
      const actIds = new Set(act.map(a => a.id)); const carga = {};
      const lista = [];
      for (const [doc, x] of Object.entries(map)) {
        const cl = S.D.cli.get(doc); const s = cl?.saldo || 0;
        if (actIds.has(x.a)) { const k = carga[x.a] || (carga[x.a] = { n: 0, s: 0 }); k.n++; k.s += s; }
        else lista.push({ doc, saldo: s });
      }
      const res = L.balancear(lista, act, carga);
      for (const [doc, a] of Object.entries(res)) { map[doc] = Object.assign({}, map[doc], { a, f: L.today(), o: 'R' }); n++; }
      await ref.set(Object.assign({}, d, { map }));
    });
    toast(`${n} clientes redistribuidos`);
  } catch (e) { toast(errMsg(e)); }
}

/* ---------- Exportaciones ---------- */
async function exportar(nombre, hojas) {
  if (!S.dl || typeof XLSX === 'undefined') return toast('La descarga no está disponible en esta vista.');
  const wb = XLSX.utils.book_new();
  for (const [n, rows] of hojas) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{ '': 'Sin datos' }]), n.slice(0, 31));
  const data = XLSX.write(wb, { type: 'array', bookType: 'xlsx' });
  try { await S.dl.save({ filename: nombre, data: new Uint8Array(data) }); }
  catch (e) { if (e?.code !== 'declined') toast('No se pudo descargar: ' + (e?.message || e?.code)); }
}
function expCartera() {
  const fs = filtrarCartera();
  const cart = fs.map(f => ({ Documento: f.doc, Cliente: f.nom, Teléfono: f.cl?.tel || '', Asesor: asesorNom(f.x.a), 'Fecha asignación': f.x.f, Origen: { C: 'Corte', N: 'Ingreso en el mes', M: 'Manual', R: 'Redistribución' }[f.x.o] || '', 'Atraso máx.': f.atMax, Saldo: f.saldo, 'Cuotas vencidas a la fecha': f.liq?.n || 0, 'Fecha liquidación': f.liq?.f || '', 'Valor cuotas': Math.round(f.liq?.tot.cuota || 0), Mora: Math.round(f.liq?.tot.mor || 0), Punitorio: Math.round(f.liq?.tot.pun || 0), 'Gastos cobranza': Math.round(f.liq?.tot.gas || 0), IVA: Math.round(f.liq?.tot.iva || 0), 'Total exigible': Math.round(f.liq?.tot.total || 0), Estado: f.estado, 'Gestiones mes': f.gsMes.length, 'Última gestión': f.last ? f.last.ts.slice(0, 10) : '', 'Último resultado': f.last?.res || '', 'Próximo contacto': f.prox || '', 'Promesa fecha': f.promUlt?.pf || '', 'Promesa monto': f.promUlt?.pm || '', 'Promesa estado': f.promUlt?.e || '' }));
  const docs = new Set(fs.map(f => f.doc));
  const gest = S.D.items.filter(g => docs.has(g.doc) && L.monthOf(g.ts) === S.D.mes).map(g => ({ Fecha: g.ts.replace('T', ' '), Documento: g.doc, Cliente: g.nom, Asesor: asesorNom(g.a), Canal: g.canal, Resultado: g.res, 'Monto promesa': g.pm || '', 'Fecha promesa': g.pf || '', 'Próximo contacto': g.px || '', Observación: g.obs || '' }));
  exportar(`Cartera_Gestiones_${S.D.mes}.xlsx`, [['Cartera', cart], ['Gestiones', gest]]);
}
function expRecuperos() {
  const m = $('#recMes').value, s = scope(), g = s === 'all' ? S.recA : '';
  const items = (S.recup[m]?.items || []).filter(r => (s === 'all' || r.a === s) && (!g || r.a === g));
  exportar(`Recuperos_${m}.xlsx`, [['Recuperos', items.map(r => ({ 'Fecha pago': r.fup, 'Fecha carga': r.fc, Documento: r.doc, Cliente: r.nom, Operación: r.op, Asesor: asesorNom(r.a), Tipo: r.tipo === 'SALIDA' ? 'CANCELACIÓN / REFINANCIACIÓN' : r.tipo, 'Atraso anterior': r.atA, 'Atraso nuevo': r.atN, 'Cuotas pend. anterior': r.cpA, 'Cuotas pend. nuevo': r.cpN, Monto: r.monto, 'Cálculo': r.met }))]]);
}

/* ---------- Enlaces de eventos por vista ---------- */

    const p = $('#cProc'); if (p) p.onclick = procesarArchivo;
    const cf = $('#cConf'); if (cf) cf.onclick = confirmarCarga;
    const cc = $('#cCanc'); if (cc) cc.onclick = () => { S.carga = {}; renderTabForce(); };
  },
  referencias() {
    const form = $('#refForm');

      const n = $('#nAs').value.trim(); if (!n) return;

    $('#rRes').onclick = e => { if (e.target.dataset.delres !== undefined) { e.target.closest('tr').remove(); form.dataset.dirty = '1'; } };

async function fillNames() {
  if (!S.user) return;
  const els = [...document.querySelectorAll('[data-uid]')]; if (!els.length) return;
  const ids = [...new Set(els.map(e => e.dataset.uid).filter(Boolean))]; if (!ids.length) return;
  try { const ps = await S.user.profiles(ids); els.forEach(e => { const p = ps[e.dataset.uid]; if (p && p.name) e.textContent = p.name; }); } catch (e) { }
}

/* ---------- Suscripciones ---------- */
function subMes() {
  const mes = S.meta?.mes || L.monthOf(L.today());
  const ms = [...new Set([mes, L.prevMonth(mes), L.monthOf(L.today())])];
  const key = ms.join(',');
  if (key === S.monthKey) return;
  S.monthSubs.forEach(u => u()); S.monthSubs = []; S.monthKey = key;
  S.asigDoc = null; S.asigLoaded = false; S.recup = {}; S.gest = new Map();
  S.monthSubs.push(S.db.doc('asignaciones/' + mes).onSnapshot(s => { S.asigDoc = s.exists ? s.data() : null; S.asigLoaded = true; render(); }, e => console.warn(e)));
  for (const m of [mes, L.prevMonth(mes)]) S.monthSubs.push(S.db.doc('recuperos/' + m).onSnapshot(s => { if (s.exists) S.recup[m] = s.data(); else delete S.recup[m]; render(); }, e => console.warn(e)));
  S.monthSubs.push(S.db.collection('gestiones').where('mes', 'in', ms).onSnapshot(q => { const m = new Map(); q.docs.forEach(d => m.set(d.id, Object.assign({ _id: d.id }, d.data()))); S.gest = m; render(); }, e => console.warn(e)));
}

async function init() {
  derive(); render();
  const use = n => { try { return typeof claude !== 'undefined' && claude.use ? Promise.resolve(claude.use(n)).catch(() => null) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); } };
  const [db, user, dl] = await Promise.all([use('db'), use('user'), use('downloads')]);
  S.db = db; S.user = user; S.dl = dl; S.dbChecked = true;
  if (user) { S.uid = await user.id(); S.isOwner = await user.isOwner(); }
  if (!S.isOwner && S.tab !== 'inicio') S.tab = 'inicio';
  if (!db) return render();
  const slow = setTimeout(() => { if (!S.cfgLoaded || !S.metaLoaded) { const n = $('#netnote'); if (n) n.innerHTML = '<div class="note n-amb">Los datos todavía no responden. Revisa tu conexión; la página seguirá intentando.</div>'; } }, 10000);
  const clr = () => { if (S.cfgLoaded && S.metaLoaded) { clearTimeout(slow); const n = $('#netnote'); if (n) n.innerHTML = ''; } };
  db.doc('config/main').onSnapshot(s => { S.cfg = s.exists ? s.data() : null; S.cfgLoaded = true; clr(); render(); }, e => { S.cfgLoaded = true; clr(); render(); });
  db.doc('base/meta').onSnapshot(s => { S.meta = s.exists ? s.data() : null; S.metaLoaded = true; clr(); subMes(); render(); }, e => { S.metaLoaded = true; clr(); render(); });
  db.collection('basechunks').onSnapshot(q => { const m = new Map(); q.docs.forEach(d => m.set(d.id, d.data())); S.chunks = m; render(); }, e => console.warn(e));
  db.collection('solicitudes').onSnapshot(q => { S.solic = q.docs.map(d => d.data()); render(); }, e => console.warn(e));
  db.doc('cargas/log').onSnapshot(s => { S.log = s.exists ? s.data() : null; render(); }, e => console.warn(e));
}

document.addEventListener('click', e => { const b = e.target.closest('#nav button, #hinfo [data-tab]'); if (b) { S.tab = b.dataset.tab; $('#main').dataset.v = ''; render(); window.scrollTo(0, 0); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open) cerrarModal(); });
