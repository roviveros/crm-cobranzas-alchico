<style>
/* Estilo basado en "Saldo de Clientes - GT", con paleta del logo Alchico (negro + verde) */
:root{
  --negro:#151816;--negro2:#2A302C;
  --verde:#3A9A57;--verde-osc:#256B3C;--verde-claro:#BFE5C3;--verde-suave:#E9F6E7;
  --bg:#F5F9F4;--card:#fff;--ink:#1D2420;--mut:#6B776E;--line:#DDE8DA;
  --acc:#2E8B4E;--acc2:#E9F6E7;
  --red:#B23A3A;--redbg:#FBE4E4;--amb:#B07A12;--ambbg:#FDF3DE;--grn:#2E8B4E;--grnbg:#E4F4E4;--blu:#3A6EA5;--blubg:#E4EEF7;--r:10px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--negro);color:#fff;padding:12px 24px 0;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.18);border-bottom:3px solid var(--verde)}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-chip{background:#fff;border-radius:10px;padding:5px 14px;display:flex;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.logo-chip img{height:40px;display:block}
.brand{font-weight:600;font-size:18px;letter-spacing:.3px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--verde-claro);margin-top:2px;letter-spacing:.2px}
.hinfo{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}
.pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);padding:4px 10px;border-radius:99px;white-space:nowrap}
.hinfo select{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:7px;padding:4px 8px}
.hinfo select option{color:#000}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:rgba(255,255,255,.68);padding:9px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:600;font-size:13px;margin-bottom:-3px}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--verde)}
nav .badge{background:var(--red);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px}
main{max-width:1400px;margin:0 auto;padding:20px}
h2{font-size:18px;margin:4px 0 12px;color:var(--negro)}
h3{font-size:14px;margin:18px 0 10px;color:var(--negro);border-bottom:2px solid var(--verde-claro);padding-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--verde);border-radius:12px;padding:16px 18px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.kpi .l{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;color:var(--negro);line-height:1.15}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--negro2);font-weight:600;color:#fff;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td{background:#FAFCF9}
tr.click{cursor:pointer}tr.click:hover td{background:var(--verde-suave)}
tfoot td{font-weight:700;background:var(--verde-suave);color:var(--verde-osc);border-top:2px solid var(--verde-claro)}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.t-red{background:var(--redbg);color:var(--red)}.t-amb{background:var(--ambbg);color:var(--amb)}.t-grn{background:var(--grnbg);color:var(--grn)}.t-blu{background:var(--blubg);color:var(--blu)}.t-gry{background:#EFEFEF;color:#666}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1;min-width:200px}
input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px rgba(58,154,87,.15)}
textarea{width:100%;min-height:70px;resize:vertical}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:13px;transition:background .15s}
.btn:hover{background:var(--verde-suave)}
.btn.p{background:var(--negro);border-color:var(--negro);color:#fff}.btn.p:hover{background:var(--verde-osc);border-color:var(--verde-osc)}
.btn.d{color:var(--red)}.btn.sm{padding:4px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:default}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--verde-osc);font-weight:600}
label.f input,label.f select,label.f textarea{color:var(--ink);font-weight:400;font-size:13px}
.mut{color:var(--mut)}.sm{font-size:12px}.b{font-weight:700}.red{color:var(--red)}.grn{color:var(--grn)}
a{color:var(--verde-osc)}
.note{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.n-amb{background:var(--ambbg);color:#7a4e0e;border:1px solid #F1D9A6}.n-red{background:var(--redbg);color:#7a271a;border:1px solid #F0C4C4}.n-blu{background:var(--blubg);color:#1d3f66;border:1px solid #C3D6EA}.n-grn{background:var(--grnbg);color:#1d5631;border:1px solid var(--verde-claro)}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
#modal{position:fixed;inset:0;background:rgba(15,20,16,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto}
#modal.on{display:flex}
.mbox{background:var(--bg);border-radius:14px;max-width:1000px;width:100%;padding:20px 22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#mInfo>h2:first-child{margin:-20px -22px 12px;padding:18px 60px 16px 22px;background:var(--negro);color:#fff;border-radius:14px 14px 0 0;border-bottom:3px solid var(--verde);font-size:17px}
.mclose{position:absolute;right:14px;top:13px;border:0;background:rgba(255,255,255,.15);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;color:#fff;z-index:2}
.mclose:hover{background:rgba(255,255,255,.3)}
.mbox .card{background:#fff !important}
.hist{background:#fff;border:1px solid var(--line);border-left:4px solid var(--verde);border-radius:8px;padding:10px 12px;margin:0 0 10px}
.hist .h{font-size:11.5px;color:var(--mut);margin-bottom:3px}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sec h3{border-bottom:0;padding-bottom:0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--negro);color:#fff;padding:10px 16px;border-radius:8px;border-left:4px solid var(--verde);z-index:80;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.dlg{position:fixed;inset:0;background:rgba(15,20,16,.55);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg .mbox{max-width:440px;background:#fff}
.list-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.list-row:hover{background:var(--verde-suave)}.list-row .grow{flex:1;min-width:0}
.list-row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listbox{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.right{text-align:right}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--verde-claro);border-radius:6px}::-webkit-scrollbar-track{background:transparent}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12)}.hbtn.on{background:var(--verde);border-color:var(--verde)}
.hbtn .badge{background:var(--red);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px}
.hsep{width:1px;height:20px;background:rgba(255,255,255,.2)}
.tramo-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.tbar{height:8px;background:#EEF2EC;border-radius:4px;min-width:90px;overflow:hidden}.tbar>i{display:block;height:100%;border-radius:4px}
details.grp{border:1px solid var(--line);border-left:5px solid var(--gc);border-radius:var(--r);background:#fff;margin-bottom:10px;overflow:hidden}
details.grp>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;background:var(--gbg);color:var(--negro);user-select:none}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .chev{transition:transform .15s;color:var(--gc);font-size:12px}
details.grp[open]>summary .chev{transform:rotate(90deg)}
details.grp>summary .cnt{background:var(--gc);color:#fff;border-radius:99px;padding:1px 9px;font-size:12px}
details.grp>summary .hint{margin-left:auto;font-weight:400;font-size:12px;color:var(--mut)}
details.grp .listbox{border:0;border-top:1px solid var(--line);border-radius:0}
details.grp .vacio{padding:10px 14px;margin:0;border-top:1px solid var(--line)}
@media (max-width:640px){header{padding:10px 12px 0}main{padding:10px}.logo-chip img{height:32px}.hinfo{margin-left:0;width:100%}.kpi .v{font-size:18px}th,td{padding:7px 8px}#mInfo>h2:first-child{margin:-20px -22px 12px}}
@media (min-width:641px){html{zoom:.8}}
#loginOv,#pwDlg{position:fixed;inset:0;z-index:200;background:var(--bg,#F5F9F4);display:flex;align-items:center;justify-content:center;padding:16px}
#pwDlg{background:rgba(16,24,40,.45)}
.login-box{background:#fff;border:1px solid var(--line,#DDE8DA);border-radius:14px;padding:26px 24px;width:100%;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.login-brand{font-weight:700;font-size:18px;margin-bottom:16px;text-align:center}
.login-box label.f{margin-top:10px}.login-box input{width:100%}
.user-chip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:#fff;margin-left:8px}
.user-chip .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}

<main><div id="netnote"></div><div id="main"></div></main><div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>/* ===== Conexión con Supabase: login, datos compartidos, usuarios y descargas =====
   Expone window.claude.use(nombre) con la misma interfaz que usa la aplicación
   ('db', 'user', 'downloads'), de modo que la lógica del CRM no cambia. */
(function () {
  const CFG = window.CRM_CONFIG || {};
  const $b = s => document.querySelector(s);
  let sb = null, session = null, perfil = null;
  let resolveReady; const ready = new Promise(r => { resolveReady = r; });

  /* ---------- Utilidades ---------- */
  const clone = o => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  const colDe = path => path.split('/').slice(0, -1).join('/');
  function dbErr(e) {
    const t = ((e && (e.message || '')) + ' ' + (e && (e.code || ''))).toLowerCase();
    const perm = /row-level|policy|permission|42501|jwt/.test(t);
    return { code: perm ? 'invalid_argument' : 'unavailable', message: (e && e.message) || String(e) };
  }
  const snapDoc = (path, row) => ({
    id: path.split('/').pop(), exists: !!row,
    data: () => (row ? clone(row.data) : undefined),
    metadata: { fromCache: false, hasPendingWrites: false }
  });

  /* ---------- Suscripciones (tiempo real + refresco) ---------- */
  const listeners = new Set();
  function addListener(match, run, next, error) {
    let t = null, vivo = true;
    const l = {
      match,
      fire() {
        if (!vivo) return; clearTimeout(t);
        t = setTimeout(() => run().then(v => vivo && next(v)).catch(e => vivo && error && error(e)), 120);
      }
    };
    listeners.add(l); l.fire();
    return () => { vivo = false; clearTimeout(t); listeners.delete(l); };
  }
  const avisar = path => listeners.forEach(l => { if (!path || l.match(path)) l.fire(); });

  /* ---------- API de datos ---------- */
  async function getDoc(path) {
    const { data, error } = await sb.from('docs').select('path,data').eq('path', path).maybeSingle();
    if (error) throw dbErr(error);
    return snapDoc(path, data);
  }
  async function setDoc(path, data) {
    const { error } = await sb.from('docs').upsert({ path, coleccion: colDe(path), data, actualizado: new Date().toISOString() });
    if (error) throw dbErr(error);
    avisar(path);
  }
  async function delDoc(path) {
    const { error } = await sb.from('docs').delete().eq('path', path);
    if (error) throw dbErr(error);
    avisar(path);
  }
  async function runQuery(col, filtros) {
    let q = sb.from('docs').select('path,data').eq('coleccion', col);
    for (const [f, op, v] of filtros) {
      if (f === 'mes' && op === 'in') q = q.in('mes', v);
      else if (f === 'mes' && op === '==') q = q.eq('mes', v);
    }
    const { data, error } = await q.order('path').limit(5000);
    if (error) throw dbErr(error);
    const ok = r => filtros.every(([f, op, v]) => f === 'mes' || (op === '==' ? r.data[f] === v : op === 'in' ? v.includes(r.data[f]) : true));
    const docs = (data || []).filter(ok).map(r => snapDoc(r.path, r));
    return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function docRef(path) {
    return {
      id: path.split('/').pop(), path,
      get: () => getDoc(path),
      set: d => setDoc(path, clone(d)),
      update: async d => { const s = await getDoc(path); if (!s.exists) throw { code: 'invalid_argument', message: 'No existe' }; await setDoc(path, Object.assign(s.data(), clone(d))); },
      delete: () => delDoc(path),
      onSnapshot: (next, error) => addListener(p => p === path, () => getDoc(path), next, error)
    };
  }
  function query(col, filtros = []) {
    const prof = col.split('/').length + 1;
    return {
      path: col,
      where: (f, op, v) => query(col, filtros.concat([[f, op, v]])),
      orderBy: () => query(col, filtros), limit: () => query(col, filtros),
      get: () => runQuery(col, filtros),
      doc: id => docRef(col + '/' + (id || Math.random().toString(36).slice(2))),
      onSnapshot: (next, error) => addListener(p => p.startsWith(col + '/') && p.split('/').length === prof, () => runQuery(col, filtros), next, error)
    };
  }
  const db = { doc: docRef, collection: c => query(c) };

  /* ---------- Usuarios ---------- */
  const user = {
    id: async () => session ? session.user.id : null,
    isOwner: async () => !!perfil && perfil.rol === 'duena',
    canEdit: async () => !!perfil && perfil.rol === 'duena',
    can: async () => null,
    me: async () => ({ id: session ? session.user.id : null, name: (perfil && perfil.nombre) || '', email: session ? session.user.email : null, isOwner: !!perfil && perfil.rol === 'duena', canEdit: !!perfil && perfil.rol === 'duena', avatarUrl: '', color: '#3A9A57' }),
    profiles: async ids => {
      ids = [].concat(ids || []).filter(Boolean);
      const out = {}; ids.forEach(i => out[i] = { id: i, name: '', email: null, isMe: session && i === session.user.id, guest: false, avatarUrl: '', color: '#3A9A57' });
      if (!ids.length) return out;
      const { data } = await sb.from('perfiles').select('id,nombre,email').in('id', ids);
      (data || []).forEach(p => { out[p.id].name = p.nombre || p.email || ''; out[p.id].email = p.email || null; });
      return out;
    },
    search: async () => []
  };

  /* ---------- Descargas ---------- */
  const downloads = {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([data]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return { status: 'saved' };
    }
  };

  const API = { db, user, downloads };
  window.claude = { use: name => ready.then(() => API[name] || null) };

  /* ---------- Pantalla de ingreso ---------- */
  function pantallaLogin(msg, modo) {
    let ov = $b('#loginOv');
    if (!ov) { ov = document.createElement('div'); ov.id = 'loginOv'; document.body.appendChild(ov); }
    const nueva = modo === 'nueva';
    const logo = (document.querySelector('.logo-chip img') || {}).src || '';
    ov.innerHTML = `<div class="login-box">${logo ? `<div style="text-align:center;margin-bottom:10px"><img src="${logo}" alt="Alchico" style="height:44px"></div>` : ''}<div class="login-brand">CRM de Gestión de Cobranzas</div>
      <form id="loginForm">
        ${nueva ? '<p class="sm">Ingresá tu nueva contraseña.</p>' : '<label class="f">Correo<input type="email" id="lgMail" autocomplete="username" required></label>'}
        <label class="f">${nueva ? 'Nueva contraseña' : 'Contraseña'}<input type="password" id="lgPass" autocomplete="${nueva ? 'new-password' : 'current-password'}" minlength="${nueva ? 8 : 1}" required></label>
        <button class="btn p" type="submit" style="width:100%;margin-top:12px">${nueva ? 'Guardar contraseña' : 'Ingresar'}</button>
        ${nueva ? '' : '<p class="sm" style="text-align:center;margin:12px 0 0"><a href="#" id="lgOlv">¿Olvidaste tu contraseña?</a></p>'}
        <p class="sm" id="lgMsg" style="text-align:center;min-height:18px;margin:10px 0 0"></p>
      </form></div>`;
    if (msg) $b('#lgMsg').textContent = msg;
    $b('#loginForm').onsubmit = async e => {
      e.preventDefault(); const m = $b('#lgMsg'); m.textContent = 'Verificando…';
      if (nueva) {
        const { error } = await sb.auth.updateUser({ password: $b('#lgPass').value });
        m.textContent = error ? 'No se pudo guardar: ' + error.message : 'Contraseña actualizada.';
        if (!error) { history.replaceState(null, '', location.pathname); await entrar(); }
        return;
      }
      const { data, error } = await sb.auth.signInWithPassword({ email: $b('#lgMail').value.trim(), password: $b('#lgPass').value });
      if (error) { m.textContent = 'Correo o contraseña incorrectos.'; return; }
      session = data.session; await entrar();
    };
    const olv = $b('#lgOlv');
    if (olv) olv.onclick = async e => {
      e.preventDefault(); const mail = $b('#lgMail').value.trim(); const m = $b('#lgMsg');
      if (!mail) { m.textContent = 'Escribí tu correo y volvé a presionar.'; return; }
      const { error } = await sb.auth.resetPasswordForEmail(mail, { redirectTo: location.origin + location.pathname });
      m.textContent = error ? 'No se pudo enviar: ' + error.message : 'Te enviamos un correo para restablecer la contraseña.';
    };
  }


  /* ---------- Cambiar contraseña (con la sesión iniciada) ---------- */
  function cambiarClave() {
    const d = document.createElement('div'); d.id = 'pwDlg';
    d.innerHTML = `<div class="login-box"><div class="login-brand">Cambiar contraseña</div>
      <form id="pwForm">
        <label class="f">Contraseña actual<input type="password" id="pwAct" autocomplete="current-password" required></label>
        <label class="f">Nueva contraseña<input type="password" id="pwNue" autocomplete="new-password" minlength="8" required></label>
        <label class="f">Repetir nueva contraseña<input type="password" id="pwRep" autocomplete="new-password" minlength="8" required></label>
        <p class="sm" style="margin:8px 0 0;color:var(--mut,#6B776E)">Mínimo 8 caracteres.</p>
        <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" type="button" id="pwCanc" style="flex:1">Cancelar</button><button class="btn p" type="submit" style="flex:1">Guardar</button></div>
        <p class="sm" id="pwMsg" style="text-align:center;min-height:18px;margin:10px 0 0"></p>
      </form></div>`;
    document.body.appendChild(d);
    const cerrar = () => d.remove();
    d.querySelector('#pwCanc').onclick = cerrar;
    d.addEventListener('click', e => { if (e.target === d) cerrar(); });
    d.querySelector('#pwAct').focus();
    d.querySelector('#pwForm').onsubmit = async e => {
      e.preventDefault();
      const m = d.querySelector('#pwMsg'), act = d.querySelector('#pwAct').value, nue = d.querySelector('#pwNue').value, rep = d.querySelector('#pwRep').value;
      if (nue !== rep) { m.textContent = 'Las contraseñas nuevas no coinciden.'; return; }
      if (nue === act) { m.textContent = 'La nueva contraseña debe ser distinta de la actual.'; return; }
      m.textContent = 'Verificando…';
      const v = await sb.auth.signInWithPassword({ email: session.user.email, password: act });
      if (v.error) { m.textContent = 'La contraseña actual no es correcta.'; return; }
      const { error } = await sb.auth.updateUser({ password: nue });
      if (error) { m.textContent = 'No se pudo cambiar: ' + error.message; return; }
      m.textContent = 'Contraseña actualizada.';
      setTimeout(cerrar, 1200);
    };
  }

  async function entrar() {
    const { data: p } = await sb.from('perfiles').select('id,nombre,email,rol').eq('id', session.user.id).maybeSingle();
    perfil = p || { id: session.user.id, nombre: session.user.email, rol: 'asesor' };
    const ov = $b('#loginOv'); if (ov) ov.remove();
    sb.channel('crm-docs').on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, pl => {
      const p = (pl.new && pl.new.path) || (pl.old && pl.old.path); avisar(p || null);
    }).subscribe();
    setInterval(() => { if (document.visibilityState === 'visible') avisar(null); }, 300000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') avisar(null); });
    const chip = document.createElement('div'); chip.className = 'user-chip';
    chip.innerHTML = '<span></span><button class="btn sm" type="button" data-pw>Cambiar contraseña</button><button class="btn sm" type="button" data-out>Salir</button>';
    chip.querySelector('span').textContent = perfil.nombre || session.user.email;
    chip.querySelector('[data-out]').onclick = async () => { await sb.auth.signOut(); location.reload(); };
    chip.querySelector('[data-pw]').onclick = cambiarClave;
    const hrow = $b('header .hrow'); if (hrow) hrow.appendChild(chip);
    resolveReady();
  }

  async function iniciar() {
    if (!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY || /TU-PROYECTO|PEGAR/.test(CFG.SUPABASE_URL + CFG.SUPABASE_ANON_KEY)) {
      pantallaLogin('Falta configurar config.js con la URL y la clave pública de Supabase.'); return;
    }
    if (typeof supabase === 'undefined') { pantallaLogin('No se pudo cargar la librería de Supabase. Revisá la conexión.'); return; }
    sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    let recuperando = /type=recovery/.test(location.hash);
    sb.auth.onAuthStateChange((ev, s) => { if (ev === 'PASSWORD_RECOVERY') { recuperando = true; session = s; pantallaLogin('', 'nueva'); } });
    const { data } = await sb.auth.getSession();
    session = data.session;
    if (recuperando && session) { pantallaLogin('', 'nueva'); return; }
    if (session) await entrar(); else pantallaLogin();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
})();

<script>/* ===== Lógica de negocio (sin dependencias de UI) ===== */
const L = (() => {
  // Columnas de la base -> clave interna
  const COLS = [
    ['op', 'operacion nro'], ['nom', 'nombre / razon social'], ['doc', 'documento'], ['tel', 'telefono'],
    ['liq', 'liquido desembolsado'], ['sc', 'saldo capital'], ['si', 'saldo interes'], ['mon', 'moneda'],
    ['fdes', 'fecha desembolso'], ['vc', 'valor cuota'], ['cp', 'cuotas pendientes'], ['ct', 'cuotas totales'],
    ['pv', 'proximo vto'], ['at', 'atraso'], ['sit', 'situacion'], ['aso', 'asociacion'],
    ['fup', 'fecha ultimo pago'], ['ban', 'banca'], ['tip', 'tipo de operacion'], ['cap', 'capital'], ['int', 'interes']
  ];
  const KEYS = COLS.map(c => c[0]);
  const REQUIRED = ['op', 'nom', 'doc', 'sc', 'si', 'at', 'fup', 'cp'];
  const DATE_KEYS = new Set(['fdes', 'pv', 'fup']);
  const NUM_KEYS = new Set(['liq', 'sc', 'si', 'vc', 'cp', 'ct', 'at', 'cap', 'int']);

  const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/\./g, '').replace(/\s+/g, ' ').trim();

  const pad = n => String(n).padStart(2, '0');
  const isoUTC = d => `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`;
  const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => isoLocal(new Date());
  const monthOf = iso => (iso || '').slice(0, 7);
  const prevMonth = m => { let [y, mo] = m.split('-').map(Number); mo--; if (mo === 0) { mo = 12; y--; } return `${y}-${pad(mo)}`; };
  const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return isoUTC(d); };

  function toISODate(v) {
    if (v === null || v === undefined || v === '') return '';
    if (v instanceof Date) return isoUTC(new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate())));
    if (typeof v === 'number' && isFinite(v)) {
      if (v < 1) return '';
      return isoUTC(new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000));
    }
    const s = String(v).trim();
    if (!s) return '';
    if (/^\d+(\.\d+)?$/.test(s)) return toISODate(Number(s));
    let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if (m) { let y = +m[3]; if (y < 100) y += 2000; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    return '';
  }
  function toNum(v) {
    if (typeof v === 'number') return v;
    const s = String(v ?? '').trim();
    if (!s) return 0;
    // admite 1.234.567 o 1234567,50
    const c = s.replace(/\s/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.');
    const n = Number(c);
    return isFinite(n) ? n : 0;
  }

  /** rows: array de arrays (primera fila = encabezados). Devuelve {ops, errores, advertencias} */
  function parseSheet(aoa) {
    const errores = [], advertencias = [];
    let hIdx = aoa.findIndex(r => (r || []).some(c => norm(c) === 'operacion nro' || norm(c) === 'operacion nro'));
    if (hIdx < 0) hIdx = 0;
    const header = (aoa[hIdx] || []).map(norm);
    const idx = {};
    COLS.forEach(([k, name]) => { const i = header.indexOf(name); if (i >= 0) idx[k] = i; });
    const faltan = REQUIRED.filter(k => idx[k] === undefined).map(k => COLS.find(c => c[0] === k)[1]);
    if (faltan.length) { errores.push('Faltan columnas: ' + faltan.join(', ')); return { ops: [], errores, advertencias }; }
    const ops = []; const vistos = new Set();
    for (let r = hIdx + 1; r < aoa.length; r++) {
      const row = aoa[r]; if (!row || row.every(c => c === null || c === undefined || String(c).trim() === '')) continue;
      const o = {};
      KEYS.forEach(k => {
        const v = idx[k] === undefined ? '' : row[idx[k]];
        if (DATE_KEYS.has(k)) o[k] = toISODate(v);
        else if (NUM_KEYS.has(k)) o[k] = toNum(v);
        else o[k] = String(v ?? '').trim();
      });
      if (!o.op || !o.doc) { advertencias.push(`Fila ${r + 1} sin Nro. de operación o documento: omitida`); continue; }
      if (vistos.has(o.op)) { advertencias.push(`Operación ${o.op} repetida: se tomó la primera`); continue; }
      vistos.add(o.op); ops.push(o);
    }
    return { ops, errores, advertencias };
  }

  // Compactación para guardar en la base de datos
  const pack = o => KEYS.map(k => o[k]);
  const unpack = a => { const o = {}; KEYS.forEach((k, i) => o[k] = a[i] ?? (NUM_KEYS.has(k) ? 0 : '')); return o; };

  /** Agrupa operaciones por cliente (documento) */
  function clientes(ops) {
    const m = new Map();
    for (const o of ops) {
      let c = m.get(o.doc);
      if (!c) { c = { doc: o.doc, nom: o.nom, tel: o.tel, ops: [], atMax: 0, saldo: 0, sc: 0, si: 0, mon: o.mon, cuota: 0 }; m.set(o.doc, c); }
      c.ops.push(o);
      c.atMax = Math.max(c.atMax, o.at || 0);
      c.sc += o.sc || 0; c.si += o.si || 0; c.saldo = c.sc + c.si;
      if ((o.at || 0) > 0) c.cuota += o.vc || 0;
      if (!c.tel && o.tel) c.tel = o.tel;
    }
    return m;
  }

  /**
   * Asignación balanceada por cantidad y saldo.
   * asesores: [{id}] activos. cargaInicial: {id:{n, s}}. lista: clientes a asignar.
   * Devuelve {doc: asesorId}
   */
  function balancear(lista, asesores, cargaInicial = {}) {
    const res = {};
    if (!asesores.length || !lista.length) return res;
    const carga = {}; asesores.forEach(a => carga[a.id] = { n: cargaInicial[a.id]?.n || 0, s: cargaInicial[a.id]?.s || 0 });
    const totN = Object.values(carga).reduce((t, c) => t + c.n, 0) + lista.length;
    const totS = Object.values(carga).reduce((t, c) => t + c.s, 0) + lista.reduce((t, c) => t + c.saldo, 0);
    const objN = Math.max(totN / asesores.length, 1), objS = Math.max(totS / asesores.length, 1);
    const orden = [...lista].sort((a, b) => b.saldo - a.saldo || a.doc.localeCompare(b.doc));
    for (const c of orden) {
      let best = null, bestScore = Infinity;
      for (const a of asesores) {
        const k = carga[a.id];
        const score = Math.max((k.n + 1) / objN, 0) + (k.s + c.saldo) / objS;
        if (score < bestScore - 1e-9) { bestScore = score; best = a.id; }
      }
      res[c.doc] = best; carga[best].n++; carga[best].s += c.saldo;
    }
    return res;
  }

  function primerDiaHabil(mes, feriados = []) {
    const f = new Set(feriados);
    let d = mes + '-01';
    for (let i = 0; i < 15; i++) {
      const wd = new Date(d + 'T00:00:00Z').getUTCDay();
      if (wd !== 0 && wd !== 6 && !f.has(d)) return d;
      d = addDays(d, 1);
    }
    return mes + '-01';
  }

  /**
   * Procesa una carga.
   * nuevaOps: operaciones parseadas. anteriorOps: base vigente (o []).
   * fechaBase: 'YYYY-MM-DD'. cfg: configuración.
   * asigMes: mapa de asignación del mes de la base ({doc:{a,f,o}}) o null si no existe (=> corte).
   * asigPrev: mapa del mes anterior (para atribuir recuperos con pago del mes anterior).
   * forzarCorte: rehace la asignación de corte.
   */
  function procesarCarga({ nuevaOps, anteriorOps, fechaBase, fechaAnterior, cfg, asigMes, asigPrev, forzarCorte }) {
    const mes = monthOf(fechaBase);
    const diasMin = Number(cfg.diasMin) || 5;
    const activos = (cfg.asesores || []).filter(a => a.activo);
    const esCorte = forzarCorte || !asigMes || !Object.keys(asigMes).length;
    const cli = clientes(nuevaOps);
    const asig = esCorte ? {} : JSON.parse(JSON.stringify(asigMes));
    const enMora = [...cli.values()].filter(c => c.atMax >= diasMin);
    const pendientes = enMora.filter(c => !asig[c.doc]);
    // carga actual por asesor (solo para incremental)
    const cargaIni = {};
    if (!esCorte) {
      for (const [doc, x] of Object.entries(asig)) {
        const c = cli.get(doc); if (!cargaIni[x.a]) cargaIni[x.a] = { n: 0, s: 0 };
        cargaIni[x.a].n++; cargaIni[x.a].s += c ? c.saldo : 0;
      }
    }
    const nuevos = balancear(pendientes, activos, cargaIni);
    for (const [doc, a] of Object.entries(nuevos)) asig[doc] = { a, f: fechaBase, o: esCorte ? 'C' : 'N', at: cli.get(doc).atMax };
    const sinAsesor = pendientes.filter(c => !nuevos[c.doc]).length;

    // Recuperos: cambio de Fecha último pago, con atraso > 0 en la base anterior
    const prevMap = new Map((anteriorOps || []).map(o => [o.op, o]));
    const nuevaMap = new Map(nuevaOps.map(o => [o.op, o]));
    const umbralTotal = (cfg.atrasoTotalMax === null || cfg.atrasoTotalMax === '' || cfg.atrasoTotalMax === undefined)
      ? diasMin - 1 : Number(cfg.atrasoTotalMax);
    const recuperos = [];
    const mesAnt = prevMonth(mes);
    for (const o of nuevaOps) {
      const p = prevMap.get(o.op); if (!p) continue;
      if (!o.fup || o.fup === p.fup || (p.fup && o.fup < p.fup)) continue;
      if (!((p.at || 0) > 0)) continue;
      // asesor responsable: mes del pago; si no estaba asignado ahí, mes anterior de la base
      const mesPago = monthOf(o.fup);
      let mesRec = null, asesorId = null;
      const cands = mesPago === mesAnt ? [[mesAnt, asigPrev], [mes, asig]] : [[mes, asig], [mesAnt, asigPrev]];
      for (const [m, mapa] of cands) if (mapa && mapa[o.doc]) { mesRec = m; asesorId = mapa[o.doc].a; break; }
      if (!asesorId) continue; // cliente no estaba en gestión
      const saldoAnt = (p.sc || 0) + (p.si || 0), saldoNvo = (o.sc || 0) + (o.si || 0);
      let monto = saldoAnt - saldoNvo, metodo = 'saldo';
      if (!(monto > 0)) { const dc = (p.cp || 0) - (o.cp || 0); monto = dc > 0 ? dc * (o.vc || p.vc || 0) : 0; metodo = dc > 0 ? 'cuotas' : 'sin variación'; }
      recuperos.push({
        k: `${o.op}_${o.fup}`, mes: mesRec, fc: fechaBase, fup: o.fup, op: o.op, doc: o.doc, nom: o.nom, a: asesorId,
        tipo: (o.at || 0) <= umbralTotal ? 'TOTAL' : 'PARCIAL', atA: p.at || 0, atN: o.at || 0,
        cpA: p.cp || 0, cpN: o.cp || 0, monto: Math.round(monto), met: metodo, mon: o.mon
      });
    }
    // Operaciones que salieron de la base (cancelación total o refinanciación):
    // si tenían cuotas vencidas, suman al recupero solo por el importe vencido
    const salidas = [];
    const fAnt = fechaAnterior || fechaBase;
    for (const p of anteriorOps || []) {
      if (nuevaMap.has(p.op) || !((p.at || 0) > 0)) continue;
      let asesorId = null, mesRec = null;
      for (const [m, mapa] of [[mes, asig], [mes, asigMes], [mesAnt, asigPrev]]) if (mapa && mapa[p.doc]) { mesRec = m; asesorId = mapa[p.doc].a; break; }
      if (!asesorId) continue;
      let nv = 0;
      if (p.pv) for (let j = 0; j < (p.cp || 0); j++) { const v = j === 0 ? p.pv : habil(addMonths(p.pv, j), cfg.feriados); if (v <= fAnt) nv++; else break; }
      if (!nv) nv = 1;
      const monto = Math.round(nv * (p.vc || 0));
      salidas.push({ op: p.op, doc: p.doc, nom: p.nom, a: asesorId, at: p.at, saldo: (p.sc || 0) + (p.si || 0), nv, monto });
      recuperos.push({
        k: `${p.op}_salida`, mes: mesRec, fc: fechaBase, fup: fechaBase, op: p.op, doc: p.doc, nom: p.nom, a: asesorId,
        tipo: 'SALIDA', atA: p.at || 0, atN: 0, cpA: p.cp || 0, cpN: 0, monto, met: `${nv} cuota${nv > 1 ? 's' : ''} vencida${nv > 1 ? 's' : ''}`, mon: p.mon
      });
    }
    const porAsesor = {};
    for (const [doc, x] of Object.entries(asig)) {
      const c = cli.get(doc); const k = porAsesor[x.a] || (porAsesor[x.a] = { n: 0, s: 0, nuevos: 0 });
      k.n++; k.s += c ? c.saldo : 0; if (nuevos[doc]) k.nuevos++;
    }
    return {
      mes, esCorte, asig, nuevos, sinAsesor, recuperos, salidas, porAsesor,
      stats: { filas: nuevaOps.length, clientes: cli.size, enMora: enMora.length, nuevos: Object.keys(nuevos).length }
    };
  }

  /** Estado de una promesa */
  function estadoPromesa(p, recuperosCliente, hoy, tol) {
    const lim = addDays(p.promFecha, Number(tol) || 0);
    const desde = (p.ts || '').slice(0, 10);
    const r = recuperosCliente.find(r => (r.fup || r.fc) >= desde && (r.fup || r.fc) <= lim);
    if (r) return { e: 'Cumplida', r };
    if (hoy > lim) return { e: 'Incumplida' };
    return { e: 'Vigente' };
  }

  /* ---------- Tasa y liquidación de mora ---------- */
  /** Tasa mensual del sistema francés: cuota = C·i/(1-(1+i)^-n) */
  function tasaMensual(C, cuota, n) {
    if (!(C > 0 && cuota > 0 && n > 0) || cuota * n <= C) return 0;
    let lo = 0, hi = 1;
    for (let k = 0; k < 100; k++) { const m = (lo + hi) / 2; const pv = cuota * (1 - Math.pow(1 + m, -n)) / m; if (pv > C) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
  const finDeMes = iso => { const [y, m] = iso.split('-').map(Number); const d = new Date(Date.UTC(y, m, 0)); return isoUTC(d); };
  function addMonths(iso, k) {
    const [y, m, d] = iso.split('-').map(Number);
    const t = new Date(Date.UTC(y, m - 1 + k, 1));
    const ult = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
    t.setUTCDate(Math.min(d, ult)); return isoUTC(t);
  }
  const dias = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);

  /** Corre al siguiente día hábil si cae sábado, domingo o feriado */
  function habil(iso, feriados = []) {
    const fs = new Set(feriados || []); let d = iso;
    for (let k = 0; k < 10; k++) { const wd = new Date(d + 'T00:00:00Z').getUTCDay(); if (wd !== 0 && wd !== 6 && !fs.has(d)) return d; d = addDays(d, 1); }
    return iso;
  }
  /** Tasa nominal anual (%) como la muestra el sistema: tasa mensual francés sobre "Capital" × 12, truncada a 2 decimales */
  const tasaAnual = o => Math.floor(tasaMensual(o.cap || o.sc, o.vc, o.ct) * 12 * 10000 + 1e-6) / 100;
  /**
   * Proyecta las cuotas vencidas de una operación a la fecha `f` (réplica del sistema de Alchico):
   * Mora = saldo de la cuota × tasa anual / 365 × días de atraso. Punitorio = mora × %.
   * IVA sobre mora + punitorio. Cada concepto redondeado a guaraníes.
   */
  function liquidar(o, f, cfg) {
    const i = tasaMensual(o.cap || o.sc, o.vc, o.ct);
    const ta = tasaAnual(o);
    const pctPun = (Number(cfg.pctPunitorio ?? 30) || 0) / 100;
    const iva = cfg.aplicaIva === false ? 0 : (Number(cfg.ivaPct ?? 10) || 0) / 100;
    const gDias = Number(cfg.gastoDias ?? 91) || 0, gMonto = Number(cfg.gastoMonto ?? 66000) || 0;
    const cuotas = [];
    const z = { cuota: 0, cap: 0, mor: 0, pun: 0, gas: 0, iva: 0, total: 0 };
    if (!o.pv || !(o.cp > 0)) return { i, ta, cuotas, tot: z };
    const pagadas = (o.ct || 0) - o.cp;
    for (let j = 0; j < o.cp; j++) {
      const venc = j === 0 ? o.pv : habil(addMonths(o.pv, j), cfg.feriados);
      if (venc > f) break;
      const d = Math.max(0, dias(venc, f));
      const base = o.vc;
      const morR = base * ta / 100 / 365 * d, punR = morR * pctPun;
      const gas = d >= gDias ? gMonto : 0;
      const mor = Math.round(morR), pun = Math.round(punR), imp = Math.round((mor + pun) * iva) + Math.round(gas * (cfg.gastoIva === false ? 0 : iva));
      cuotas.push({ n: pagadas + j + 1, venc, d, cuota: o.vc, cap: base, mor, pun, gas, iva: imp, total: o.vc + mor + pun + gas + imp });
    }
    const tot = cuotas.reduce((t, c) => { t.cuota += c.cuota; t.cap += c.cap; t.mor += c.mor; t.pun += c.pun; t.gas += c.gas; t.iva += c.iva; t.total += c.total; return t; }, z);
    return { i, ta, cuotas, tot };
  }

  function fechaDeNombre(nombre) {
    const m = String(nombre || '').match(/_(\d{2})(\d{2})(\d{2})_/);
    if (!m) return '';
    const d = `20${m[3]}-${m[2]}-${m[1]}`;
    return /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(d) ? d : '';
  }

  return { COLS, KEYS, parseSheet, pack, unpack, clientes, balancear, procesarCarga, primerDiaHabil, estadoPromesa,
    fechaDeNombre, tasaMensual, tasaAnual, liquidar, finDeMes, addMonths, dias, monthOf, prevMonth, addDays, today, toISODate, norm };
})();

</script><script>/* ===== CRM de Cobranzas — interfaz ===== */
const DEFAULT_CFG = {
  diasMin: 5, atrasoTotalMax: '', tolPromesa: 2, pctPunitorio: 30, aplicaIva: true, ivaPct: 10, gastoDias: 91, gastoMonto: 66000, gastoIva: true,
  asesores: [],
  canales: ['Llamada', 'WhatsApp', 'SMS', 'Correo', 'Visita'],
  resultados: [
    { n: 'Promesa de pago', c: true, p: true },
    { n: 'Contactado - sin compromiso', c: true, p: false },
    { n: 'Indica que ya pagó (a validar)', c: true, p: false },
    { n: 'Solicita refinanciación', c: true, p: false },
    { n: 'Se niega a pagar', c: true, p: false },
    { n: 'Contacto con tercero', c: false, p: false },
    { n: 'No contesta', c: false, p: false },
    { n: 'Apagado / fuera de servicio', c: false, p: false },
    { n: 'Número equivocado', c: false, p: false },
    { n: 'Mensaje enviado', c: false, p: false }
  ],
  feriados: ['2026-12-08', '2026-12-25', '2027-01-01', '2027-05-01', '2027-05-14', '2027-05-15', '2027-08-15', '2027-12-08', '2027-12-25']
};
const CHUNK = 700;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NF = new Intl.NumberFormat('es-PY', { maximumFractionDigits: 0 });
const fmt = n => NF.format(Math.round(n || 0));
const fd = iso => iso ? `${iso.slice(8, 10)}/${iso.slice(5, 7)}/${iso.slice(0, 4)}` : '—';
const fdt = ts => ts ? `${fd(ts.slice(0, 10))} ${ts.slice(11, 16)}` : '—';
const monL = c => String(c) === '6900' ? 'Gs.' : (c || '');
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const mesL = m => m ? `${MESES[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}` : '—';
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowTs = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${L.today()}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
const pct = (a, b) => b ? Math.round(a * 100 / b) + '%' : '—';

const S = {
  db: null, user: null, dl: null, uid: null, isOwner: false, canWrite: null,
  cfg: null, cfgLoaded: false, meta: null, metaLoaded: false, chunks: new Map(), asigDoc: null, asigLoaded: false,
  recup: {}, gest: new Map(), solic: [], log: null,
  tab: 'inicio', viewAs: 'all', open: null, monthSubs: [], monthKey: '', D: null,
  filtros: { q: '', estado: 'todos', tramo: '', orden: 'atraso', limit: 200 }, promA: '', recA: '', agOpen: {}, recMes: null, carga: null, fLiq: null
};
const cfg = () => Object.assign({}, DEFAULT_CFG, S.cfg || {});
const asesorById = id => cfg().asesores.find(a => a.id === id);
const asesorNom = id => asesorById(id)?.nombre || (id ? 'Asesor ' + id : 'Sin asesor');
const meAsesor = () => S.uid ? cfg().asesores.find(a => a.uid && a.uid === S.uid) : null;
const esAdm = () => S.isOwner || !!meAsesor()?.admin;
const scope = () => esAdm() ? S.viewAs : (meAsesor()?.id || '__none__');

function toast(msg, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function dialog(html, botones) {
  return new Promise(res => {
    const d = document.createElement('div'); d.className = 'dlg';
    d.innerHTML = `<div class="mbox">${html}<div class="bar" style="justify-content:flex-end;margin:14px 0 0">${botones.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${esc(b.t)}</button>`).join('')}</div></div>`;
    d.addEventListener('click', e => { const i = e.target.dataset?.i; if (i !== undefined) { d.remove(); res(botones[+i].v); } });
    document.body.appendChild(d);
  });
}
const confirmar = (html, ok = 'Confirmar') => dialog(html, [{ t: 'Cancelar', v: false }, { t: ok, v: true, cls: 'p' }]);

/* ---------- Escritura serializada ---------- */
let wq = Promise.resolve();
function enCola(fn) { const p = wq.then(fn, fn); wq = p.catch(() => { }); return p; }
function errMsg(e) {
  if (!e) return 'Error desconocido';
  if (e.code === 'invalid_argument') return 'No tienes permiso para guardar esto (o el dato es inválido).';
  if (e.code === 'quota_exceeded') return 'Se alcanzó el límite de almacenamiento: ' + (e.message || '');
  if (e.code === 'resource_exhausted') return 'Demasiadas operaciones seguidas; espera unos segundos e intenta de nuevo.';
  return e.message || String(e.code || e);
}

/* ---------- Datos derivados ---------- */
function derive() {
  const c = cfg();
  const meta = S.meta;
  let ops = [];
  let baseOk = false;
  if (meta && meta.chunks) {
    const parts = [];
    for (let i = 0; i < meta.chunks; i++) { const ch = S.chunks.get('c' + i); if (!ch || ch.v !== meta.v) { parts.length = 0; break; } parts.push(ch); }
    if (parts.length === meta.chunks) { ops = parts.flatMap(p => p.rows.map(L.unpack)); baseOk = true; }
  }
  const cli = L.clientes(ops);
  const asig = S.asigDoc?.map || {};
  const mes = meta?.mes || '';
  // gestiones
  const items = [];
  for (const d of S.gest.values()) for (const it of d.items || []) items.push(Object.assign({ _d: d._id }, it));
  items.sort((a, b) => a.ts < b.ts ? -1 : 1);
  const gByDoc = new Map();
  for (const it of items) { (gByDoc.get(it.doc) || gByDoc.set(it.doc, []).get(it.doc)).push(it); }
  // recuperos
  const recAll = Object.values(S.recup).flatMap(r => r?.items || []);
  const rByDoc = new Map();
  for (const r of recAll) (rByDoc.get(r.doc) || rByDoc.set(r.doc, []).get(r.doc)).push(r);
  const resC = new Set(c.resultados.filter(r => r.c).map(r => r.n));
  const hoy = L.today();
  const fLiq = fechaLiq();
  // estado por cliente asignado
  const mk = (doc, x, conLiq = true) => {
    const cl = cli.get(doc);
    const gs = gByDoc.get(doc) || [];
    const gsMes = gs.filter(g => L.monthOf(g.ts) === mes);
    const last = gs[gs.length - 1] || null;
    let pxItem = null; for (let i = gs.length - 1; i >= 0; i--) if (gs[i].px) { pxItem = gs[i]; break; }
    let prox = null;
    if (pxItem) { const hecho = gs.some(g => g.ts > pxItem.ts && g.ts.slice(0, 10) >= pxItem.px); if (!hecho) prox = pxItem.px; }
    const recs = rByDoc.get(doc) || [];
    const proms = gs.filter(g => g.pf).map(g => Object.assign({}, g, L.estadoPromesa(g, recs, hoy, c.tolPromesa)));
    const promUlt = proms[proms.length - 1] || null;
    const recMes = recs.filter(r => r.mes === mes);
    let estado = 'En mora';
    if (!cl) estado = 'Fuera de base'; else if (cl.atMax < (Number(c.diasMin) || 5)) estado = 'Regularizado';
    const liq = cl && conLiq ? liqCliente(cl, fLiq, c) : null;
    return {
      doc, x, cl, liq, nom: cl?.nom || x.nom || (recs.find(r => r.nom) || {}).nom || (gs.find(g => g.nom) || {}).nom || doc, gs, gsMes, last, prox, proms, promUlt, recs, recMes, estado,
      gestionado: gsMes.length > 0, contactado: gsMes.some(g => resC.has(g.res)),
      atMax: cl?.atMax ?? 0, saldo: cl?.saldo ?? 0, asignado: !!x.a
    };
  };
  const filas = Object.entries(asig).map(([doc, x]) => mk(doc, x));
  S.D = { mk, ops, cli, asig, mes, filas, gByDoc, rByDoc, items, baseOk, recAll, hoy };
}
function fechaLiq() { const tope = L.finDeMes(L.today()); let f = S.fLiq || tope; if (f > tope) f = tope; return f; }
function liqCliente(cl, f, c) {
  const ops = cl.ops.map(o => Object.assign({ o }, L.liquidar(o, f, c)));
  const tot = ops.reduce((t, x) => { for (const k in x.tot) t[k] = (t[k] || 0) + x.tot[k]; return t; }, { cuota: 0, cap: 0, mor: 0, pun: 0, gas: 0, iva: 0, total: 0 });
  return { f, ops, tot, n: ops.reduce((t, x) => t + x.cuotas.length, 0) };
}
const TRAMOS = [
  { k: 't0', n: 'Al día', min: -Infinity, max: 0, c: '#2E8B4E' },
  { k: 't1', n: '1-30 días', min: 1, max: 30, c: '#3A6EA5' },
  { k: 't2', n: '31-60 días', min: 31, max: 60, c: '#C99A2E' },
  { k: 't3', n: '61-90 días', min: 61, max: 90, c: '#D9762B' },
  { k: 't4', n: '91-120 días', min: 91, max: 120, c: '#C2502F' },
  { k: 't5', n: '121-180 días', min: 121, max: 180, c: '#B23A3A' },
  { k: 't6', n: 'Más de 180 días', min: 181, max: Infinity, c: '#7A1F1F' }
];
const tramoDe = at => TRAMOS.find(t => (at || 0) >= t.min && (at || 0) <= t.max) || TRAMOS[0];
function filasScope() { const s = scope(); return s === 'all' ? S.D.filas : S.D.filas.filter(f => f.x.a === s); }

/* ---------- Render principal ---------- */
let rq = false;
function render() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; try { derive(); renderHeader(); renderTab(); if (S.open) renderModalInfo(); } catch (e) { console.error(e); } }); }

function renderHeader() {
  const me = meAsesor();
  const info = [];
  if (S.meta) info.push(`<span class="pill">${S.asigDoc?.corte ? `Asignación Inicial: ${fd(S.asigDoc.corte)}  · ` : ''}Última carga: ${fd(S.meta.fecha)}</span>`);
  else if (S.metaLoaded) info.push('<span class="pill">Sin base cargada</span>');
  if (esAdm()) {
    const opts = [['all', 'Todos los asesores'], ...cfg().asesores.map(a => [a.id, a.nombre + (a.activo ? '' : ' (inactivo)')])];
    info.push(`<select id="viewAs" title="Ver como">${opts.map(([v, t]) => `<option value="${esc(v)}" ${S.viewAs === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`);
    const sol = S.solic.length;
    info.push(`<span class="hsep"></span><button class="hbtn ${S.tab === 'carga' ? 'on' : ''}" data-tab="carga">Carga de base</button><button class="hbtn ${S.tab === 'referencias' ? 'on' : ''}" data-tab="referencias">Referencias${sol ? `<span class="badge">${sol}</span>` : ''}</button>`);
  } else if (me) info.push(`<span class="pill">${esc(me.nombre)}</span>`);
  $('#hinfo').innerHTML = info.join('');
  const vs = $('#viewAs'); if (vs) vs.onchange = () => { S.viewAs = vs.value; render(); };
  if (!S.isOwner && S.cfgLoaded && !meAsesor()) { $('#nav').innerHTML = ''; return; }
  const tabs = [['inicio', 'Inicio'], ['cartera', 'Cartera'], ['agenda', 'Agenda'], ['promesas', 'Efectividad'], ['recuperos', 'Recuperos']];
  const fs = S.D ? filasScope() : [];
  const pend = fs.filter(f => f.prox && f.prox <= S.D.hoy).length;
  $('#nav').innerHTML = tabs.map(([k, t]) => `<button data-tab="${k}" class="${S.tab === k ? 'on' : ''}">${t}${k === 'agenda' && pend ? `<span class="badge">${pend}</span>` : ''}</button>`).join('');
}

function renderTab() {
  const el = $('#main');
  if (!S.db) { el.innerHTML = `<div class="card empty">${S.dbChecked ? 'No se pudo conectar con la base de datos. Revisá la conexión y volvé a ingresar.' : 'Conectando…'}</div>`; return; }
  if (!S.isOwner && S.cfgLoaded && !meAsesor()) { el.innerHTML = vistaSinVinculo(); bindSinVinculo(); return; }
  const v = { inicio: vInicio, cartera: vCartera, agenda: vAgenda, promesas: vPromesas, recuperos: vRecuperos, carga: vCarga, referencias: vReferencias }[S.tab] || vInicio;
  if ((S.tab === 'carga' || S.tab === 'referencias') && !esAdm()) { S.tab = 'inicio'; }
  // no re-renderizar formularios en edición
  if ((S.tab === 'referencias' && el.dataset.v === 'referencias' && el.querySelector('[data-dirty="1"]')) ||
    (S.tab === 'carga' && el.dataset.v === 'carga' && S.carga?.busy)) return;
  el.dataset.v = S.tab;
  el.innerHTML = v();
  (BIND[S.tab] || (() => { }))();
  fillNames();
}

/* ---------- Sin vínculo ---------- */
function vistaSinVinculo() {
  const sol = S.solic.find(s => s.uid === S.uid);
  const libres = cfg().asesores.filter(a => a.activo && !a.uid);
  if (!S.uid) return `<div class="card empty">Iniciá sesión para acceder al CRM.</div>`;
  return `<div class="card" style="max-width:520px;margin:30px auto">
  <h2>Bienvenido/a al CRM de Gestión de Cobranzas</h2>
  <p class="mut">Tu usuario todavía no está vinculado a un asesor. Elige tu nombre y envía la solicitud; la administradora la aprobará.</p>
  ${sol ? `<div class="note n-blu">Solicitud enviada como <b>${esc(asesorNom(sol.asesorId))}</b>. Espera la aprobación.</div>` : ''}
  ${libres.length ? `<label class="f">Soy<select id="solAs">${libres.map(a => `<option value="${esc(a.id)}">${esc(a.nombre)}</option>`).join('')}</select></label>
  <div class="bar" style="margin-top:12px"><button class="btn p" id="solBtn">${sol ? 'Actualizar solicitud' : 'Enviar solicitud'}</button></div>`
      : '<div class="note n-amb">No hay asesores disponibles para vincular. Pide a la administradora que te agregue en la tabla de referencias.</div>'}
  </div>`;
}
function bindSinVinculo() {
  const b = $('#solBtn'); if (!b) return;
  b.onclick = () => enCola(async () => {
    b.disabled = true;
    try { await S.db.doc('solicitudes/' + S.uid).set({ uid: S.uid, asesorId: $('#solAs').value, ts: nowTs() }); toast('Solicitud enviada'); }
    catch (e) { toast(errMsg(e)); } finally { b.disabled = false; }
  });
}

/* ---------- Inicio ---------- */
function resumenAsesor(fs) {
  const recs = fs.flatMap(f => f.recMes);
  const proms = fs.flatMap(f => f.proms.filter(p => L.monthOf(p.ts) === S.D.mes));
  return {
    n: fs.length, s: fs.reduce((t, f) => t + f.saldo, 0), g: fs.filter(f => f.gestionado).length, c: fs.filter(f => f.contactado).length,
    nG: fs.reduce((t, f) => t + f.gsMes.length, 0),
    pv: proms.filter(p => p.e === 'Vigente'), pc: proms.filter(p => p.e === 'Cumplida'), pi: proms.filter(p => p.e === 'Incumplida'),
    rn: recs.length, rm: recs.reduce((t, r) => t + (r.monto || 0), 0), rt: recs.filter(r => r.tipo === 'TOTAL').length,
    reg: fs.filter(f => f.estado === 'Regularizado' || f.estado === 'Fuera de base').length
  };
}
function vInicio() {
  if (!S.metaLoaded) return '<div class="card empty">Cargando…</div>';
  if (!S.meta) return `<div class="card empty">Aún no hay una base cargada.${esAdm() ? ' Ve a <b>Carga de base</b> para subir el inventario de cartera.' : ''}</div>`;
  if (!S.D.baseOk) return '<div class="card empty">Cargando la base…</div>';
  const fs = filasScope(); const r = resumenAsesor(fs); const hoy = S.D.hoy;
  const agendaHoy = fs.filter(f => f.prox && f.prox <= hoy).length;
  let html = `<h2>Resumen de ${mesL(S.D.mes)}</h2>
  <div class="kpis">
   <div class="kpi"><div class="l">Clientes asignados</div><div class="v">${fmt(r.n)}</div><div class="s">Saldo Gs. ${fmt(r.s)}</div></div>
   <div class="kpi"><div class="l">Gestionados</div><div class="v">${pct(r.g, r.n)}</div><div class="s">${fmt(r.g)} clientes · ${fmt(r.nG)} gestiones</div></div>
   <div class="kpi"><div class="l">Contactabilidad</div><div class="v">${pct(r.c, r.n)}</div><div class="s">${fmt(r.c)} con contacto efectivo</div></div>
   <div class="kpi"><div class="l">Agenda pendiente</div><div class="v ${agendaHoy ? 'red' : ''}">${fmt(agendaHoy)}</div><div class="s">contactos hoy o vencidos</div></div>
   <div class="kpi"><div class="l">Promesas vigentes</div><div class="v">${fmt(r.pv.length)}</div><div class="s">Gs. ${fmt(r.pv.reduce((t, p) => t + (+p.pm || 0), 0))}</div></div>
   <div class="kpi"><div class="l">Promesas cumplidas / incumplidas</div><div class="v"><span class="grn">${r.pc.length}</span> / <span class="red">${r.pi.length}</span></div><div class="s">efectividad ${pct(r.pc.length, r.pc.length + r.pi.length)}</div></div>
   <div class="kpi"><div class="l">Recuperos del mes</div><div class="v grn">Gs. ${fmt(r.rm)}</div><div class="s">${r.rn} pagos · ${r.rt} totales</div></div>
   <div class="kpi"><div class="l">Clientes regularizados</div><div class="v">${fmt(r.reg)}</div><div class="s">${pct(r.reg, r.n)} de la cartera</div></div>
  </div>`;
  html += resumenTramos();
  if (esAdm() && scope() === 'all') {
    const ids = [...new Set([...cfg().asesores.map(a => a.id), ...S.D.filas.map(f => f.x.a)])];
    const rows = ids.map(id => [id, resumenAsesor(S.D.filas.filter(f => f.x.a === id))]).filter(([id, x]) => x.n || asesorById(id)?.activo);
    html += `<h3>Por asesor</h3><div class="tw"><table><thead><tr><th>Asesor</th><th class="n">Clientes</th><th class="n">Saldo</th><th class="n">Gestionados</th><th class="n">Contactados</th><th class="n">Prom. vigentes</th><th class="n">Cumpl./Incumpl.</th><th class="n">Recuperos</th><th class="n">Monto recuperado</th><th class="n">Regularizados</th></tr></thead><tbody>
    ${rows.map(([id, x]) => `<tr><td>${esc(asesorNom(id))}${asesorById(id)?.activo === false ? ' <span class="tag t-gry">inactivo</span>' : ''}</td><td class="n">${fmt(x.n)}</td><td class="n">${fmt(x.s)}</td><td class="n">${pct(x.g, x.n)}</td><td class="n">${pct(x.c, x.n)}</td><td class="n">${x.pv.length}</td><td class="n">${x.pc.length} / ${x.pi.length}</td><td class="n">${x.rn}</td><td class="n">${fmt(x.rm)}</td><td class="n">${fmt(x.reg)}</td></tr>`).join('')}
    </tbody><tfoot><tr><td>Total</td><td class="n">${fmt(r.n)}</td><td class="n">${fmt(r.s)}</td><td class="n">${pct(r.g, r.n)}</td><td class="n">${pct(r.c, r.n)}</td><td class="n">${r.pv.length}</td><td class="n">${r.pc.length} / ${r.pi.length}</td><td class="n">${r.rn}</td><td class="n">${fmt(r.rm)}</td><td class="n">${fmt(r.reg)}</td></tr></tfoot></table></div>`;
  }
  return html;
}

function resumenTramos() {
  const s = scope(), all = s === 'all';
  const asig = S.D.asig;
  let cls = [...S.D.cli.values()];
  if (!all) cls = cls.filter(cl => asig[cl.doc]?.a === s);
  const docOf = cl => cl.doc;
  const rows = TRAMOS.map(t => ({ t, n: 0, s: 0, a: 0 }));
  let N = 0, ST = 0, A = 0;
  for (const cl of cls) {
    const r = rows[TRAMOS.indexOf(tramoDe(cl.atMax))];
    r.n++; r.s += cl.saldo || 0; N++; ST += cl.saldo || 0;
    if (asig[docOf(cl)]) { r.a++; A++; }
  }
  const mx = Math.max(1, ...rows.map(r => r.s));
  return `<h3>Resumen por tramos de mora</h3>
  <p class="sm mut" style="margin-top:-4px">${all ? 'Toda la base vigente' : 'Clientes asignados'} al ${fd(S.meta.fecha)}, por el mayor atraso del cliente. Saldo = capital + interés.</p>
  <div class="tw"><table><thead><tr><th>Tramo de mora</th><th class="n">Clientes</th><th class="n">% clientes</th>${all ? '<th class="n">Asignados</th>' : ''}<th class="n">Saldo</th><th class="n">% saldo</th><th style="width:22%"></th></tr></thead><tbody>
  ${rows.map(r => `<tr class="click" data-tramo="${r.t.k}"><td><span class="tramo-dot" style="background:${r.t.c}"></span>${r.t.n}</td><td class="n">${fmt(r.n)}</td><td class="n">${pct(r.n, N)}</td>${all ? `<td class="n">${fmt(r.a)}</td>` : ''}<td class="n">${fmt(r.s)}</td><td class="n">${pct(r.s, ST)}</td><td><div class="tbar"><i style="width:${(r.s / mx * 100).toFixed(1)}%;background:${r.t.c}"></i></div></td></tr>`).join('')}
  </tbody><tfoot><tr><td>Total</td><td class="n">${fmt(N)}</td><td class="n">100%</td>${all ? `<td class="n">${fmt(A)}</td>` : ''}<td class="n">${fmt(ST)}</td><td class="n">100%</td><td></td></tr></tfoot></table></div>
  <p class="sm mut">Clic en un tramo para ver esos clientes en Cartera (solo clientes asignados).</p>`;
}

/* ---------- Cartera ---------- */
function tagRec(r) { return r.tipo === 'SALIDA' ? '<span class="tag t-amb">CANCELACIÓN / REFIN.</span>' : `<span class="tag ${r.tipo === 'TOTAL' ? 't-grn' : 't-blu'}">${r.tipo}</span>`; }
function tagEstado(f) {
  if (f.estado === 'Regularizado') return '<span class="tag t-grn">Regularizado</span>';
  if (f.estado === 'Fuera de base') return '<span class="tag t-gry">Fuera de base</span>';
  if (f.estado === 'Sin asignar') return '<span class="tag t-gry">Al día · sin asignar</span>';
  const a = f.atMax; return `<span class="tag ${a > 30 ? 't-red' : a > 10 ? 't-amb' : 't-blu'}">${a} días</span>`;
}
function tagProm(p) { if (!p) return ''; const cls = { Vigente: 't-blu', Cumplida: 't-grn', Incumplida: 't-red' }[p.e]; return `<span class="tag ${cls}">Promesa ${p.e.toLowerCase()} ${fd(p.pf)}</span>`; }
function tagProx(f) { if (!f.prox) return ''; const h = S.D.hoy; return `<span class="tag ${f.prox < h ? 't-red' : f.prox === h ? 't-amb' : 't-gry'}">Contactar ${f.prox === h ? 'hoy' : fd(f.prox)}</span>`; }
function filtrarCartera() {
  const F = S.filtros, q = L.norm(F.q), h = S.D.hoy;
  let fs = filasScope();
  if (q) {
    // la búsqueda recorre toda la base: cualquier asesor puede gestionar cualquier cliente
    const hit = (nom, doc, cl) => L.norm(nom).includes(q) || doc.includes(q) || (cl?.ops || []).some(o => String(o.op).includes(q)) || (cl?.tel || '').includes(q);
    const asig = S.D.filas.filter(f => hit(f.nom, f.doc, f.cl));
    const ya = new Set(asig.map(f => f.doc));
    const libres = [...S.D.cli.values()].filter(cl => !ya.has(cl.doc) && hit(cl.nom || '', cl.doc, cl)).slice(0, 300).map(cl => S.D.mk(cl.doc, { a: '', f: '', o: '' }));
    libres.forEach(f => { if (f.estado === 'Regularizado') f.estado = 'Sin asignar'; });
    fs = asig.concat(libres);
  }
  const E = {
    sin: f => !f.gestionado, agenda: f => f.prox && f.prox <= h, pv: f => f.promUlt?.e === 'Vigente', pi: f => f.promUlt?.e === 'Incumplida',
    mora: f => f.estado === 'En mora' || (!f.asignado && f.atMax > 0), reg: f => f.asignado && f.estado !== 'En mora', rec: f => f.recMes.length > 0
  }[F.estado];
  if (E) fs = fs.filter(E);
  if (F.tramo) fs = fs.filter(f => tramoDe(f.atMax).k === F.tramo);
  const O = { atraso: (a, b) => b.atMax - a.atMax || b.saldo - a.saldo, saldo: (a, b) => b.saldo - a.saldo, exig: (a, b) => (b.liq?.tot.total || 0) - (a.liq?.tot.total || 0), prox: (a, b) => (a.prox || '9') < (b.prox || '9') ? -1 : 1, nombre: (a, b) => a.nom.localeCompare(b.nom) }[F.orden];
  return fs.sort(O);
}
function vCartera() {

  const est = [['todos', 'Todos'], ['mora', 'En mora'], ['sin', 'Sin gestión en el mes'], ['agenda', 'Contacto hoy / vencido'], ['pv', 'Promesa vigente'], ['pi', 'Promesa incumplida'], ['rec', 'Con recupero en el mes'], ['reg', 'Regularizados / fuera de base']];
  const ord = [['atraso', 'Mayor atraso'], ['exig', 'Mayor saldo vencido'], ['saldo', 'Mayor saldo'], ['prox', 'Próximo contacto'], ['nombre', 'Nombre']];
  return `<div class="sec"><h2>${q ? 'Búsqueda en la base' : 'Cartera asignada'} · ${mesL(S.D.mes)}</h2>${S.dl ? '<button class="btn sm" id="expCart">Exportar a Excel</button>' : ''}</div>
  <div class="bar"><input type="search" id="fq" placeholder="Buscar nombre, documento, operación o teléfono" value="${esc(F.q)}">
  <select id="fe">${est.map(([v, t]) => `<option value="${v}" ${F.estado === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
  <select id="ft" title="Tramo de mora"><option value="">Todos los tramos</option>${TRAMOS.map(t => `<option value="${t.k}" ${F.tramo === t.k ? 'selected' : ''}>${t.n}</option>`).join('')}</select>
  <select id="fo">${ord.map(([v, t]) => `<option value="${v}" ${F.orden === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
  <div class="bar"><label class="sm" style="display:flex;gap:6px;align-items:center">Saldo vencido al <input type="date" id="fLiq" value="${fechaLiq()}" max="${L.finDeMes(L.today())}" min="${L.today()}"></label></div>
  <p class="sm mut">${fmt(fs.length)} clientes · Saldo Gs. ${fmt(fs.reduce((t, f) => t + f.saldo, 0))} · Saldo vencido al ${fd(fechaLiq())}: Gs. ${fmt(fs.reduce((t, f) => t + (f.liq?.tot.total || 0), 0))}</p>
  ${q ? '<div class="note n-blu">La búsqueda recorre toda la base vigente, incluidos clientes asignados a otros asesores o sin asignar. Puedes registrar la gestión en cualquiera.</div>' : ''}
  ${fs.length ? `<div class="listbox">${fs.slice(0, F.limit).map(f => `<div class="list-row" data-doc="${esc(f.doc)}">

    <div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">${f.estado !== 'En mora' ? tagEstado(f) : ''} ${tagProx(f)} ${tagProm(f.promUlt)} ${f.recMes.length ? '<span class="tag t-grn">Pagó en el mes</span>' : ''} ${f.x.o === 'N' ? '<span class="tag t-gry">Ingreso ' + fd(f.x.f) + '</span>' : ''}</div></div>
    <div class="right"><div class="sm mut">Saldo Vencido</div><div class="b" style="font-size:15px">G. ${fmt(f.liq?.tot.total || 0)}</div><div class="sm mut">${f.liq?.n ? f.liq.n + ' cuota' + (f.liq.n > 1 ? 's' : '') + ' al ' + fd(fechaLiq()) : 'al ' + fd(fechaLiq())}</div></div></div>`).join('')}</div>
    ${fs.length > F.limit ? '<div class="bar" style="justify-content:center;margin-top:10px"><button class="btn" id="mas">Ver más</button></div>' : ''}`
      : '<div class="card empty">No hay clientes con esos filtros.</div>'}`;
}

/* ---------- Agenda ---------- */
function vAgenda() {
  if (!S.D.baseOk) return '<div class="card empty">Aún no hay datos.</div>';
  const h = S.D.hoy, h7 = L.addDays(h, 7), fs = filasScope();
  const venc = fs.filter(f => f.prox && f.prox < h).sort((a, b) => a.prox < b.prox ? -1 : 1);
  const hoy = fs.filter(f => f.prox === h);
  const prox = fs.filter(f => f.prox && f.prox > h && f.prox <= h7).sort((a, b) => a.prox < b.prox ? -1 : 1);
  const promHoy = fs.filter(f => f.promUlt && f.promUlt.e === 'Vigente' && f.promUlt.pf <= h);
  const sinG = fs.filter(f => !f.gestionado && f.estado === 'En mora');
  const lst = (arr, extra) => arr.length ? `<div class="listbox">${arr.map(f => `<div class="list-row" data-doc="${esc(f.doc)}"><div class="grow"><div class="nm">${esc(f.nom)}</div><div class="sm mut">${esc(f.cl?.tel || '')} ${scope() === 'all' ? '· ' + esc(asesorNom(f.x.a)) : ''} · ${extra(f)}</div></div>${tagEstado(f)}</div>`).join('')}</div>` : '<p class="mut sm vacio">Nada pendiente.</p>';
  const grupos = [
    { g: 'venc', t: 'Vencidos', arr: venc, ex: f => 'debía contactarse el ' + fd(f.prox), c: '#B23A3A', bg: '#FBE4E4', hint: 'contacto atrasado' },
    { g: 'hoy', t: 'Hoy', arr: hoy, ex: f => f.last ? 'Últ.: ' + esc(f.last.res) : '', c: '#C99A2E', bg: '#FDF3DE', hint: fd(h) },
    { g: 'prom', t: 'Promesas que vencen hoy o en tolerancia', arr: promHoy, ex: f => 'Gs. ' + fmt(f.promUlt.pm) + ' para el ' + fd(f.promUlt.pf), c: '#3A6EA5', bg: '#E4EEF7', hint: 'verificar pago' },
    { g: 'prox', t: 'Próximos 7 días', arr: prox, ex: f => fd(f.prox), c: '#2E8B4E', bg: '#E9F6E7', hint: 'hasta el ' + fd(h7) },
    { g: 'sing', t: 'En mora sin gestión en el mes', arr: sinG.sort((a, b) => b.atMax - a.atMax).slice(0, 100), n: sinG.length, ex: f => f.atMax + ' días · Gs. ' + fmt(f.saldo), c: '#5F6B62', bg: '#F0F2EF', hint: sinG.length > 100 ? 'se muestran los 100 de mayor atraso' : 'ordenado por atraso' }
  ];
  return `<div class="sec"><h2>Agenda de contactos</h2><div class="bar" style="margin:0"><button class="btn sm" id="agExp">Expandir todo</button><button class="btn sm" id="agCol">Contraer todo</button></div></div>
  ${grupos.map(x => { const open = S.agOpen[x.g] ?? true; return `<details class="grp" data-g="${x.g}" style="--gc:${x.c};--gbg:${x.bg}" ${open ? 'open' : ''}><summary><span class="chev">▶</span>${x.t}<span class="cnt">${x.n ?? x.arr.length}</span><span class="hint">${x.hint}</span></summary>${lst(x.arr, x.ex)}</details>`; }).join('')}`;
}

/* ---------- Efectividad (promesas) ---------- */

  return `<label class="sm" style="display:flex;gap:6px;align-items:center">Gestor <select id="${id}"><option value="">Todos</option>${ids.map(i => `<option value="${esc(i)}" ${val === i ? 'selected' : ''}>${esc(asesorNom(i))}</option>`).join('')}</select></label>`;
}
function vPromesas() {
  if (!S.D.baseOk) return '<div class="card empty">Aún no hay datos.</div>';
  const all = scope() === 'all';
  let fs = filasScope(); const mes = S.D.mes;
  if (all && S.promA) fs = fs.filter(f => f.x.a === S.promA);
  const ps = fs.flatMap(f => f.proms.filter(p => L.monthOf(p.ts) === mes || p.e === 'Vigente').map(p => ({ p, f }))).sort((a, b) => a.p.pf < b.p.pf ? -1 : 1);

  <div class="kpi"><div class="l">Incumplidas</div><div class="v red">${t('Incumplida').length}</div><div class="s">Gs. ${fmt(sum(t('Incumplida')))}</div></div></div>

  ${ps.map(({ p, f }) => `<tr class="click" data-doc="${esc(f.doc)}"><td>${esc(f.nom)}</td>${all ? `<td>${esc(asesorNom(f.x.a))}</td>` : ''}<td>${fd(p.ts.slice(0, 10))}</td><td>${fd(p.pf)}</td><td class="n">${fmt(p.pm)}</td><td>${tagProm(p).replace('Promesa ', '')}</td><td class="n">${p.r ? fmt(p.r.monto) + ' (' + fd(p.r.fup) + ')' : ''}</td></tr>`).join('')}
  </tbody></table></div>` : `<div class="card empty">Sin promesas registradas en el mes${all && S.promA ? ' para este gestor' : ''}.</div>`}`;

  <h3>Detalle</h3>
  ${items.length ? `<div class="tw"><table><thead><tr><th>Fecha pago</th><th>Cliente</th><th>Operación</th>${s === 'all' ? '<th>Asesor</th>' : ''}<th>Tipo</th><th class="n">Atraso ant. → nuevo</th><th class="n">Cuotas pend.</th><th class="n">Monto</th></tr></thead><tbody>
  ${items.map(r => `<tr class="click" data-doc="${esc(r.doc)}"><td>${fd(r.fup)}</td><td>${esc(r.nom)}</td><td>${esc(r.op)}</td>${s === 'all' ? `<td>${esc(asesorNom(r.a))}</td>` : ''}<td>${tagRec(r)}</td><td class="n">${r.atA} → ${r.atN}</td><td class="n">${r.cpA} → ${r.cpN}</td><td class="n">${fmt(r.monto)}${r.met !== 'saldo' ? ' <span class="sm mut">(' + esc(r.met) + ')</span>' : ''}</td></tr>`).join('')}
  </tbody></table></div>` : '<div class="card empty">Sin recuperos detectados en el mes.</div>'}`;
}

  <div class="bar" style="margin-top:12px"><button class="btn p" id="cProc" ${c.busy ? 'disabled' : ''}>Procesar vista previa</button><span class="sm mut">${esc(c.nombre || '')}</span></div>

async function procesarArchivo() {
  const c = S.carga; c.err = ''; c.res = null; c.warn = '';
  const f = $('#cFile').files[0] || c.file;
  if (!f) { c.err = 'Selecciona el archivo.'; return renderTab(); }
  c.file = f; c.nombre = f.name;
  c.fecha = $('#cFecha').value || L.fechaDeNombre(f.name) || L.today();
  c.forzar = !!$('#cForzar')?.checked;
  if (typeof XLSX === 'undefined') { c.err = 'No se pudo cargar el lector de Excel. Revisa tu conexión y recarga la página.'; return renderTab(); }
  c.busy = true; c.prog = 'Leyendo archivo…'; renderTabForce();
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array', cellDates: false });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
    const p = L.parseSheet(aoa);
    if (p.errores.length) throw new Error(p.errores.join(' '));
    if (!p.ops.length) throw new Error('El archivo no tiene operaciones.');
    c.ops = p.ops; c.adv = p.advertencias;
    const mes = L.monthOf(c.fecha), mesAnt = L.prevMonth(mes);
    c.prog = 'Comparando con la base vigente…'; renderTabForce();
    const [a1, a2] = await Promise.all([S.db.doc('asignaciones/' + mes).get(), S.db.doc('asignaciones/' + mesAnt).get()]);
    const asigMes = a1.exists ? (a1.data().map || {}) : null;
    const asigPrev = a2.exists ? (a2.data().map || {}) : null;
    if (S.meta && c.fecha < S.meta.fecha) c.warn = `La fecha de esta base (${fd(c.fecha)}) es anterior a la base vigente (${fd(S.meta.fecha)}). Revisa antes de confirmar.`;
    else if (S.meta && c.fecha === S.meta.fecha) c.warn = `Ya existe una carga con fecha ${fd(c.fecha)}: se reemplazará. Los recuperos ya registrados no se duplican.`;
    const anterior = S.D.baseOk ? S.D.ops : [];
    c.res = L.procesarCarga({ nuevaOps: p.ops, anteriorOps: anterior, fechaBase: c.fecha, fechaAnterior: S.meta?.fecha || '', cfg: cfg(), asigMes, asigPrev, forzarCorte: c.forzar });
    c.asigMesExist = !!a1.exists; c.prog = '';
  } catch (e) { c.err = 'No se pudo procesar: ' + (e.message || e); c.res = null; c.prog = ''; }
  c.busy = false; renderTabForce();
}
function renderTabForce() { const el = $('#main'); el.dataset.v = ''; const b = S.carga?.busy; if (S.carga) S.carga.busy = false; renderTab(); if (S.carga) S.carga.busy = b; }

async function confirmarCarga() {
  const c = S.carga, r = c.res; if (!r) return;
  if (r.esCorte && c.asigMesExist && !(await confirmar(`<h3>Rehacer asignación de corte</h3><p>Se reemplazará toda la asignación de ${mesL(r.mes)}. Las gestiones registradas se conservan. ¿Continuar?</p>`))) return;
  c.busy = true;
  const prog = t => { c.prog = t; const e = $('#cProg'); if (e) e.textContent = t; };
  const btns = () => document.querySelectorAll('#cConf,#cCanc,#cProc').forEach(b => b.disabled = c.busy);
  btns();
  try {
    await enCola(async () => {
      const v = rid();
      const rows = c.ops.map(L.pack);
      const n = Math.ceil(rows.length / CHUNK);
      for (let i = 0; i < n; i++) { prog(`Guardando base ${i + 1}/${n}…`); await S.db.doc('basechunks/c' + i).set({ i, v, rows: rows.slice(i * CHUNK, (i + 1) * CHUNK) }); }
      const oldN = S.meta?.chunks || 0;
      for (let i = n; i < oldN; i++) await S.db.doc('basechunks/c' + i).delete();
      prog('Guardando asignación…');
      const asigData = { mes: r.mes, map: r.asig, corte: c.fecha, act: nowTs() };
      if (!r.esCorte) { const a1 = await S.db.doc('asignaciones/' + r.mes).get(); if (a1.exists && a1.data().corte) asigData.corte = a1.data().corte; }
      await S.db.doc('asignaciones/' + r.mes).set(asigData);
      prog('Guardando recuperos…');
      const porMes = {}; r.recuperos.forEach(x => (porMes[x.mes] || (porMes[x.mes] = [])).push(x));
      let nRec = 0, mRec = 0;
      for (const [m, arr] of Object.entries(porMes)) {
        const d = await S.db.doc('recuperos/' + m).get();
        const ex = d.exists ? (d.data().items || []) : []; const keys = new Set(ex.map(x => x.k));
        const add = arr.filter(x => !keys.has(x.k)); nRec += add.length; mRec += add.reduce((t, x) => t + x.monto, 0);
        if (add.length) await S.db.doc('recuperos/' + m).set({ mes: m, items: ex.concat(add) });
      }
      prog('Actualizando base vigente…');
      await S.db.doc('base/meta').set({ v, fecha: c.fecha, mes: r.mes, archivo: c.nombre, filas: rows.length, chunks: n, ts: nowTs(), salidas: r.salidas.slice(0, 300) });
      const lg = await S.db.doc('cargas/log').get();
      const items = (lg.exists ? lg.data().items || [] : []).concat([{ fecha: c.fecha, ts: nowTs(), archivo: c.nombre, filas: rows.length, corte: r.esCorte, nuevos: r.stats.nuevos, rec: nRec, monto: mRec }]).slice(-120);
      await S.db.doc('cargas/log').set({ items });
      S.carga = {}; toast(`Base cargada: ${r.stats.nuevos} asignaciones nuevas, ${nRec} recuperos.`, 4000);
    });
  } catch (e) { c.busy = false; c.err = 'Error al guardar: ' + errMsg(e) + ' Vuelve a confirmar para reintentar.'; }
  renderTabForce();
}
